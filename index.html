<!doctype html>

  <meta charset="utf-8">

  <title>奄美観光マップ</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }


    /* ========================================
       上部UI
    ======================================== */

    .top-ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 10;

      display: flex;
      flex-direction: column;
      gap: 6px;

      pointer-events: none;
    }


    /* ========================================
       現在地ボタン
    ======================================== */

    .locate-row {
      display: flex;
      justify-content: flex-start;
      pointer-events: auto;
    }

    .map-btn {
      min-height: 42px;
      padding: 8px 12px;

      border: 1px solid #ddd;
      border-radius: 9px;

      background: #fff;
      color: #222;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 2px 6px rgba(0,0,0,0.18);

      display: inline-flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;
    }


    /* ========================================
       カテゴリパネル
    ======================================== */

    .category-panel {
      pointer-events: auto;

      width: 100%;

      padding: 6px;

      background: rgba(255,255,255,0.94);

      border: 1px solid rgba(210,210,210,0.95);
      border-radius: 10px;

      box-sizing: border-box;

      box-shadow: 0 2px 7px rgba(0,0,0,0.16);
    }


    /*
      スマホ前提：
      3列 × 2段
    */

    .category-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 4px;
    }


    .category-item {
      min-width: 0;
      min-height: 37px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      gap: 4px;

      padding: 4px 5px;

      background: rgba(255,255,255,0.82);

      border: 1px solid #e1e1e1;
      border-radius: 7px;

      box-sizing: border-box;

      font-size: 11px;
      font-weight: 600;

      line-height: 1.15;

      cursor: pointer;
    }


    .category-item input {
      width: 16px;
      height: 16px;

      margin: 0;

      flex-shrink: 0;

      cursor: pointer;
    }


    .category-label {
      min-width: 0;

      white-space: normal;
      overflow-wrap: anywhere;
    }


    /*
      クーリングシェルターだけ文字が長いので
      少し小さく
    */

    .category-item.cooling {
      font-size: 9.5px;
    }


    /* ========================================
       すべて表示
    ======================================== */

    .category-actions {
      margin-top: 4px;
    }

    #showAllBtn {
      width: 100%;

      min-height: 30px;

      padding: 4px 8px;

      border: 1px solid #ddd;
      border-radius: 7px;

      background: rgba(248,248,248,0.95);

      color: #222;

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;
    }


    /* ========================================
       GTranslate
    ======================================== */

    .gtranslate_wrapper {
      position: absolute;

      left: 8px;
      bottom: 26px;

      z-index: 10;
    }


    /* ========================================
       特に幅が狭いスマホ
    ======================================== */

    @media (max-width: 360px) {

      .category-item {
        padding: 4px;
        font-size: 10px;
      }

      .category-item.cooling {
        font-size: 8.8px;
      }

      .category-item input {
        width: 15px;
        height: 15px;
      }

    }


    /* ========================================
       タブレット / PC
    ======================================== */

    @media (min-width: 700px) {

      .top-ui {
        right: auto;
        width: 520px;
      }

      .category-item {
        font-size: 12px;
      }

      .category-item.cooling {
        font-size: 11px;
      }

    }
  </style>

    /* =========================================================
       マーカーのデザイン
    ========================================================== */

    function markerStyle(category) {

      if (category === "飲食店") {
        return {
          color: "#ff7043",
          icon: "🍴"
        };
      }

      if (category === "お買い物") {
        return {
          color: "#42a5f5",
          icon: "🛍️"
        };
      }

      if (category === "トイレ") {
        return {
          color: "#29b6f6",
          icon: "🚻"
        };
      }

      if (category === "観光案内") {
        return {
          color: "#7e57c2",
          icon: "ℹ️"
        };
      }

      if (category === "観光アトラクション") {
        return {
          color: "#8e24aa",
          icon: "⭐"
        };
      }

      if (category === "注意") {
        return {
          color: "#ef5350",
          icon: "⚠️"
        };
      }

      if (category === "クーリングシェルター") {
        return {
          color: "#00acc1",
          icon: "🧊"
        };
      }

      if (category === "病院") {
        return {
          color: "#66bb6a",
          icon: "✚"
        };
      }

      if (category === "港") {
        return {
          color: "#3949ab",
          icon: "⚓"
        };
      }

      return {
        color: "#8d6e63",
        icon: "📍"
      };
    }


    function createMarkerElement(category) {

      const style =
        markerStyle(category);

      const el =
        document.createElement("div");

      el.style.width = "36px";
      el.style.height = "36px";

      el.style.borderRadius = "50%";

      el.style.background =
        style.color;

      el.style.display = "flex";

      el.style.alignItems = "center";
      el.style.justifyContent = "center";

      el.style.fontSize = "18px";

      el.style.border =
        "2px solid #fff";

      el.style.boxShadow =
        "0 2px 6px rgba(0,0,0,0.28)";

      el.textContent =
        style.icon;

      return el;
    }


    /* =========================================================
       現在地マーカー
    ========================================================== */

    function createCurrentLocationElement() {

      const el =
        document.createElement("div");

      el.style.width = "20px";
      el.style.height = "20px";

      el.style.borderRadius = "50%";

      el.style.background =
        "#1a73e8";

      el.style.border =
        "3px solid #fff";

      el.style.boxShadow =
        "0 2px 6px rgba(0,0,0,0.28)";

      return el;
    }


    /* =========================================================
       埋め込み判定
    ========================================================== */

    function isEmbedded() {

      return window.self !== window.top;

    }


    /* =========================================================
       URLパラメータ
    ========================================================== */

    function getSpotFromQuery() {

      return new URLSearchParams(
        window.location.search
      ).get("spot");

    }


    function shouldAutoOpenCurrentLocation() {

      return new URLSearchParams(
        window.location.search
      ).get("showCurrentLocation") === "1";

    }


    /* =========================================================
       カテゴリフィルター
    ========================================================== */

    function getSelectedCategories() {

      const selected =
        new Set();


      document
        .querySelectorAll(
          ".category-checkbox"
        )
        .forEach(
          checkbox => {

            if (checkbox.checked) {

              selected.add(
                checkbox.value
              );

            }

          }
        );


      return selected;
    }


    function updateCategoryMarkers() {

      const selected =
        getSelectedCategories();


      spotMarkers.forEach(
        item => {

          item.marker.map =
            selected.has(item.category)
              ? map
              : null;

        }
      );


      if (infoWindow) {

        infoWindow.close();

      }

    }


    function setupCategoryFilter() {

      document
        .querySelectorAll(
          ".category-checkbox"
        )
        .forEach(
          checkbox => {

            checkbox.addEventListener(
              "change",
              updateCategoryMarkers
            );

          }
        );


      document
        .getElementById(
          "showAllBtn"
        )
        .addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".category-checkbox"
              )
              .forEach(
                checkbox => {

                  checkbox.checked = true;

                }
              );


            updateCategoryMarkers();

          }
        );

    }


    /* =========================================================
       URL指定スポット
    ========================================================== */

    function focusSpotIfNeeded() {

      const spotId =
        getSpotFromQuery();


      if (!spotId) {
        return;
      }


      const target =
        spots.find(
          spot =>
            spot.id === spotId
        );


      if (!target) {
        return;
      }


      /*
        URLから直接開いたスポットのカテゴリは
        必ずONにする
      */

      const checkbox =
        Array.from(
          document.querySelectorAll(
            ".category-checkbox"
          )
        ).find(
          cb =>
            cb.value === target.category
        );


      if (checkbox) {

        checkbox.checked = true;

        updateCategoryMarkers();

      }


      map.setCenter({

        lat: target.lat,
        lng: target.lng

      });


      map.setZoom(19);

    }


    /* =========================================================
       現在地自動表示
    ========================================================== */

    function autoOpenCurrentLocationIfNeeded() {

      if (
        !shouldAutoOpenCurrentLocation()
      ) {

        return;

      }


      setTimeout(
        () => {

          const btn =
            document.getElementById(
              "locateBtn"
            );


          if (btn) {

            btn.click();

          }

        },
        500
      );

    }


    /* =========================================================
       Google Maps初期化
    ========================================================== */

    async function initMap() {

      const center = {

        lat: 28.389,
        lng: 129.487

      };


      map =
        new google.maps.Map(
          document.getElementById(
            "map"
          ),
          {

            center,

            zoom: 15,

            mapTypeControl: false,

            streetViewControl: false,

            fullscreenControl: true,

            mapId:
              "ef633c769a15ea5f5f112602"

          }
        );


      infoWindow =
        new google.maps.InfoWindow();


      const bounds =
        new google.maps.LatLngBounds();


      /* =====================================================
         マーカー生成
      ===================================================== */

      spots.forEach(
        spot => {

          const marker =
            new google.maps.marker.AdvancedMarkerElement({

              map,

              position: {

                lat: spot.lat,
                lng: spot.lng

              },

              title:
                spot.title,

              content:
                createMarkerElement(
                  spot.category
                )

            });


          spotMarkers.push({

            marker,
            category: spot.category,
            spot

          });


          /* Google Maps道順 */

          const navUrl =
            `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${spot.lat},${spot.lng}&travelmode=walking`;


          marker.addListener(
            "click",
            () => {

              infoWindow.setContent(`

                <div
                  style="
                    max-width:260px;
                    line-height:1.5;
                  "
                >

                  <div
                    style="
                      font-weight:700;
                      font-size:15px;
                      margin-bottom:6px;
                    "
                  >
                    ${spot.title}
                  </div>


                  <div
                    style="
                      color:#666;
                      font-size:12px;
                      margin-bottom:7px;
                    "
                  >
                    カテゴリ：${spot.category}
                  </div>


                  <div
                    style="
                      white-space:pre-wrap;
                      margin-bottom:10px;
                    "
                  >
                    ${spot.description}
                  </div>


                  <a
                    href="${navUrl}"
                    target="_blank"
                    rel="noopener"
                    style="
                      font-weight:600;
                    "
                  >
                    現在地から案内
                  </a>

                </div>

              `);


              infoWindow.open({

                anchor: marker,
                map

              });

            }
          );


          bounds.extend({

            lat: spot.lat,
            lng: spot.lng

          });

        }
      );


      /*
        URLからスポット指定が無いときだけ
        全スポットを画面内に収める
      */

      if (
        spots.length > 0 &&
        !getSpotFromQuery()
      ) {

        map.fitBounds(bounds);

      }


      setupCategoryFilter();


      if (
        getSpotFromQuery()
      ) {

        focusSpotIfNeeded();

      }


      autoOpenCurrentLocationIfNeeded();

    }


    /* =========================================================
       現在地
    ========================================================== */

    document
      .getElementById(
        "locateBtn"
      )
      .addEventListener(
        "click",
        () => {


          /*
            Google Sites埋め込み時
          */

          if (isEmbedded()) {

            const url =
              new URL(
                window.location.href
              );


            url.searchParams.set(
              "showCurrentLocation",
              "1"
            );


            window.open(
              url.toString(),
              "_blank",
              "noopener,noreferrer"
            );


            return;

          }


          /*
            Geolocation対応確認
          */

          if (
            !navigator.geolocation
          ) {

            alert(
              "この端末は位置情報に対応していません。"
            );

            return;

          }


          navigator.geolocation.getCurrentPosition(


            /* 成功 */

            position => {

              const lat =
                position.coords.latitude;


              const lng =
                position.coords.longitude;


              const accuracy =
                position.coords.accuracy || 0;


              /*
                古い現在地を削除
              */

              if (currentMarker) {

                currentMarker.map = null;

              }


              if (currentCircle) {

                currentCircle.setMap(null);

              }


              /*
                現在地マーカー
              */

              currentMarker =
                new google.maps.marker.AdvancedMarkerElement({

                  map,

                  position: {

                    lat,
                    lng

                  },

                  title:
                    "現在地",

                  content:
                    createCurrentLocationElement()

                });


              /*
                現在地精度円
              */

              currentCircle =
                new google.maps.Circle({

                  map,

                  center: {

                    lat,
                    lng

                  },

                  radius:
                    accuracy,

                  strokeColor:
                    "#1a73e8",

                  strokeOpacity:
                    0.8,

                  strokeWeight:
                    1,

                  fillColor:
                    "#1a73e8",

                  fillOpacity:
                    0.12

                });


              map.setCenter({

                lat,
                lng

              });


              map.setZoom(16);

            },


            /* エラー */

            error => {

              alert(
                "位置情報を取得できませんでした。\n" +
                error.message
              );

            },


            /* 設定 */

            {

              enableHighAccuracy:
                true,

              timeout:
                12000,

              maximumAge:
                0

            }

          );

        }
      );


    /* =========================================================
       GTranslate
    ========================================================== */

    window.gtranslateSettings = {

      default_language:
        "ja",

      native_language_names:
        true,

      detect_browser_language:
        true,

      languages: [

        "ja",
        "en",
        "zh-CN",
        "zh-TW"

      ],

      wrapper_selector:
        ".gtranslate_wrapper"

    };

  </script>
