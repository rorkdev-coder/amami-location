<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>奄美観光マップ</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* ================================
       上部コントロール
    ================================= */

    .controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .btn {
      padding: 10px 12px;
      min-height: 42px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      text-decoration: none;
      color: #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: #f7f7f7;
    }

    /* ================================
       カテゴリフィルター
    ================================= */

    .category-wrapper {
      position: relative;
    }

    .category-panel {
      display: none;
      position: absolute;
      top: 50px;
      left: 0;

      width: 250px;
      max-width: calc(100vw - 24px);

      padding: 14px;

      background: rgba(255,255,255,0.98);
      border: 1px solid #ddd;
      border-radius: 12px;

      box-sizing: border-box;

      box-shadow: 0 4px 14px rgba(0,0,0,0.20);
    }

    .category-panel.open {
      display: block;
    }

    .category-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category-item {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 7px 4px;

      font-size: 14px;
      cursor: pointer;

      border-radius: 6px;
    }

    .category-item:hover {
      background: #f5f5f5;
    }

    .category-item input {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    .category-actions {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .show-all-btn {
      width: 100%;
      padding: 9px 10px;

      border: 1px solid #ddd;
      border-radius: 8px;

      background: #f7f7f7;
      color: #222;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .show-all-btn:hover {
      background: #eeeeee;
    }

    /* ================================
       ステータス
    ================================= */

    .status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 10;

      background: rgba(255,255,255,0.95);
      border: 1px solid #eee;
      border-radius: 10px;

      padding: 10px 12px;

      max-width: 92%;

      font-size: 12px;
      line-height: 1.4;

      box-shadow: 0 1px 4px rgba(0,0,0,0.15);

      white-space: pre-wrap;
    }

    /* ================================
       スマホ
    ================================= */

    @media (max-width: 600px) {

      .controls {
        top: 8px;
        left: 8px;
        right: 8px;
      }

      .btn {
        font-size: 13px;
        padding: 9px 10px;
      }

      .category-panel {
        top: 47px;
        width: 240px;
      }

      .status {
        left: 8px;
        bottom: 8px;
        max-width: calc(100% - 40px);
      }
    }

  </style>
</head>

        の形式で追加します。

        カテゴリフィルター側はすでに対応済みなので、

    /* =========================================================
       マーカーデザイン
    ========================================================== */

    function markerStyle(category) {

      if (category === "飲食店") {
        return {
          color: "#ff7043",
          icon: "🍴"
        };
      }

      if (category === "お買い物") {
        return {
          color: "#42a5f5",
          icon: "🛍️"
        };
      }

      if (category === "トイレ") {
        return {
          color: "#29b6f6",
          icon: "🚻"
        };
      }

      if (category === "観光案内") {
        return {
          color: "#7e57c2",
          icon: "ℹ️"
        };
      }

      if (category === "観光アトラクション") {
        return {
          color: "#8e24aa",
          icon: "⭐"
        };
      }

      if (category === "注意") {
        return {
          color: "#ef5350",
          icon: "⚠️"
        };
      }

      if (category === "クーリングシェルター") {
        return {
          color: "#00acc1",
          icon: "🧊"
        };
      }

      if (category === "病院") {
        return {
          color: "#66bb6a",
          icon: "✚"
        };
      }

      if (category === "港") {
        return {
          color: "#3949ab",
          icon: "⚓"
        };
      }

      return {
        color: "#8d6e63",
        icon: "📍"
      };
    }


    function createMarkerElement(category) {

      const style = markerStyle(category);

      const markerEl = document.createElement("div");

      markerEl.style.width = "36px";
      markerEl.style.height = "36px";
      markerEl.style.borderRadius = "50%";

      markerEl.style.background = style.color;

      markerEl.style.display = "flex";
      markerEl.style.alignItems = "center";
      markerEl.style.justifyContent = "center";

      markerEl.style.color = "#fff";
      markerEl.style.fontSize = "18px";

      markerEl.style.border = "2px solid white";

      markerEl.style.boxShadow =
        "0 2px 6px rgba(0,0,0,0.25)";

      markerEl.textContent = style.icon;

      return markerEl;
    }


    /* =========================================================
       現在地マーカー
    ========================================================== */

    function createCurrentLocationElement() {

      const markerEl = document.createElement("div");

      markerEl.style.width = "20px";
      markerEl.style.height = "20px";

      markerEl.style.borderRadius = "50%";

      markerEl.style.background = "#1a73e8";

      markerEl.style.border = "3px solid white";

      markerEl.style.boxShadow =
        "0 2px 6px rgba(0,0,0,0.25)";

      return markerEl;
    }


    /* =========================================================
       Google Sites埋め込み判定
    ========================================================== */

    function isEmbedded() {
      return window.self !== window.top;
    }


    /* =========================================================
       URLパラメータ
    ========================================================== */

    function getSpotFromQuery() {

      const params =
        new URLSearchParams(window.location.search);

      return params.get("spot");
    }


    function shouldAutoOpenCurrentLocation() {

      const params =
        new URLSearchParams(window.location.search);

      return params.get("showCurrentLocation") === "1";
    }


    /* =========================================================
       指定スポットへ移動
    ========================================================== */

    function focusSpotIfNeeded() {

      const spotId = getSpotFromQuery();

      if (!spotId) return;

      const target =
        spots.find(s => s.id === spotId);

      if (!target) return;

      /*
        リンクから開いたスポットのカテゴリが
        チェックOFFになっていた場合でも表示できるようにします。
      */

      const checkbox =
        document.querySelector(
          `.category-checkbox[value="${target.category}"]`
        );

      if (checkbox) {
        checkbox.checked = true;
        updateCategoryMarkers();
      }

      map.setCenter({
        lat: target.lat,
        lng: target.lng
      });

      map.setZoom(19);

      document.getElementById("status").textContent =
        `${target.title} を表示しています。`;
    }


    /* =========================================================
       現在地自動表示
    ========================================================== */

    function autoOpenCurrentLocationIfNeeded() {

      if (!shouldAutoOpenCurrentLocation()) return;

      const btn =
        document.getElementById("locateBtn");

      if (btn) {

        setTimeout(() => {
          btn.click();
        }, 500);

      }
    }


    /* =========================================================
       カテゴリフィルター
    ========================================================== */

    function getSelectedCategories() {

      const selected = new Set();

      document
        .querySelectorAll(".category-checkbox")
        .forEach((checkbox) => {

          if (checkbox.checked) {
            selected.add(checkbox.value);
          }

        });

      return selected;
    }


    function updateCategoryMarkers() {

      const selected =
        getSelectedCategories();

      let visibleCount = 0;

      spotMarkers.forEach((item) => {

        const shouldShow =
          selected.has(item.category);

        item.marker.map =
          shouldShow ? map : null;

        if (shouldShow) {
          visibleCount++;
        }

      });

      /*
        開いている吹き出しは閉じます。
        非表示になったマーカーの吹き出しが
        残るのを防ぐためです。
      */

      if (infoWindow) {
        infoWindow.close();
      }

      const status =
        document.getElementById("status");

      status.textContent =
        `表示中のスポット：${visibleCount}件`;
    }


    function setupCategoryFilter() {

      const categoryBtn =
        document.getElementById("categoryBtn");

      const categoryPanel =
        document.getElementById("categoryPanel");

      const showAllBtn =
        document.getElementById("showAllBtn");


      /* パネル開閉 */

      categoryBtn.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          const isOpen =
            categoryPanel.classList.toggle("open");

          categoryBtn.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
          );

        }
      );


      /* パネル内部クリックでは閉じない */

      categoryPanel.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

        }
      );


      /* チェック変更 */

      document
        .querySelectorAll(".category-checkbox")
        .forEach((checkbox) => {

          checkbox.addEventListener(
            "change",
            updateCategoryMarkers
          );

        });


      /* すべて表示 */

      showAllBtn.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".category-checkbox")
            .forEach((checkbox) => {

              checkbox.checked = true;

            });

          updateCategoryMarkers();

        }
      );


      /* 地図などを押したら閉じる */

      document.addEventListener(
        "click",
        () => {

          categoryPanel.classList.remove("open");

          categoryBtn.setAttribute(
            "aria-expanded",
            "false"
          );

        }
      );

    }


    /* =========================================================
       Google Maps 初期化
    ========================================================== */

    async function initMap() {

      const center = {
        lat: 28.389,
        lng: 129.487
      };


      map = new google.maps.Map(
        document.getElementById("map"),
        {

          center,

          zoom: 15,

          mapTypeControl: false,

          streetViewControl: false,

          fullscreenControl: true,

          /*
            これまで使用していたMap ID
          */

          mapId: "ef633c769a15ea5f5f112602"

        }
      );


      infoWindow =
        new google.maps.InfoWindow();


      const bounds =
        new google.maps.LatLngBounds();


      /* ================================
         マーカー生成
      ================================= */

      spots.forEach((spot) => {

        const marker =
          new google.maps.marker.AdvancedMarkerElement({

            map,

            position: {
              lat: spot.lat,
              lng: spot.lng
            },

            title: spot.title,

            content:
              createMarkerElement(
                spot.category
              )

          });


        /*
          カテゴリフィルター用に保存
        */

        spotMarkers.push({

          marker,

          category: spot.category,

          spot

        });


        /*
          Google Maps
          現在地から徒歩ルート
        */

        const navUrl =
          `https://www.google.com/maps/dir/?api=1&origin=Current+Location&destination=${spot.lat},${spot.lng}&travelmode=walking`;


        /* ================================
           マーカークリック
        ================================= */

        marker.addListener(
          "click",
          () => {

            infoWindow.setContent(`

              <div style="max-width:260px;">

                <div
                  style="
                    font-weight:700;
                    margin-bottom:6px;
                    font-size:15px;
                  "
                >
                  ${spot.title}
                </div>

                <div
                  style="
                    margin-bottom:6px;
                    color:#666;
                    font-size:12px;
                  "
                >
                  カテゴリ：${spot.category}
                </div>

                <div
                  style="
                    white-space:pre-wrap;
                    margin-bottom:10px;
                    line-height:1.5;
                  "
                >
                  ${spot.description}
                </div>

                <a
                  href="${navUrl}"
                  target="_blank"
                  rel="noopener"
                  style="
                    font-weight:600;
                    text-decoration:none;
                  "
                >
                  🧭 現在地から道順
                </a>

              </div>

            `);


            infoWindow.open({

              anchor: marker,

              map

            });

          }
        );


        bounds.extend({

          lat: spot.lat,

          lng: spot.lng

        });

      });


      /* ================================
         最初の表示範囲
      ================================= */

      if (
        spots.length > 0 &&
        !getSpotFromQuery()
      ) {

        map.fitBounds(bounds);

      }


      /* ================================
         カテゴリフィルター初期化
      ================================= */

      setupCategoryFilter();


      /* ================================
         URLからスポット指定
      ================================= */

      if (getSpotFromQuery()) {

        focusSpotIfNeeded();

      } else {

        document
          .getElementById("status")
          .textContent =
            `地図を表示しました。スポット数：${spots.length}`;

      }


      /* ================================
         現在地自動表示
      ================================= */

      autoOpenCurrentLocationIfNeeded();

    }


    /* =========================================================
       現在地
    ========================================================== */

    document.addEventListener(
      "click",
      (e) => {

        if (
          e.target &&
          e.target.id === "locateBtn"
        ) {

          const status =
            document.getElementById("status");


          /*
            Google Sitesに埋め込まれている場合は
            新しいページで開く
          */

          if (isEmbedded()) {

            const url =
              new URL(window.location.href);

            url.searchParams.set(
              "showCurrentLocation",
              "1"
            );

            window.open(
              url.toString(),
              "_blank",
              "noopener,noreferrer"
            );

            return;
          }


          /* ================================
             Geolocation対応確認
          ================================= */

          if (!navigator.geolocation) {

            status.textContent =
              "この端末は位置情報に対応していません。";

            return;
          }


          status.textContent =
            "位置情報を取得しています…（許可が出たら「許可」）";


          /* ================================
             現在地取得
          ================================= */

          navigator.geolocation.getCurrentPosition(

            (pos) => {

              const lat =
                pos.coords.latitude;

              const lng =
                pos.coords.longitude;

              const accuracy =
                pos.coords.accuracy || 0;


              /* 古い現在地を削除 */

              if (currentMarker) {
                currentMarker.map = null;
              }

              if (currentCircle) {
                currentCircle.setMap(null);
              }


              /* ================================
                 現在地マーカー
              ================================= */

              currentMarker =
                new google.maps.marker.AdvancedMarkerElement({

                  map,

                  position: {
                    lat,
                    lng
                  },

                  title: "現在地",

                  content:
                    createCurrentLocationElement()

                });


              /* ================================
                 精度円
              ================================= */

              currentCircle =
                new google.maps.Circle({

                  strokeColor: "#1a73e8",

                  strokeOpacity: 0.8,

                  strokeWeight: 1,

                  fillColor: "#1a73e8",

                  fillOpacity: 0.12,

                  map,

                  center: {
                    lat,
                    lng
                  },

                  radius: accuracy

                });


              /* ================================
                 現在地へ移動
              ================================= */

              map.setCenter({
                lat,
                lng
              });

              map.setZoom(16);


              status.textContent =
                `現在地を表示しました（精度目安: 約 ${Math.round(accuracy)}m）`;

            },


            /* ================================
               位置情報エラー
            ================================= */

            (err) => {

              status.textContent =
                `位置情報を取得できません：${err.message}`;

            },


            /* ================================
               Geolocation設定
            ================================= */

            {

              enableHighAccuracy: true,

              timeout: 12000,

              maximumAge: 0

            }

          );

        }

      }
    );

  </script>
